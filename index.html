<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ Sửa chữa đột xuất đường Quốc lộ 14D</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* Trang chính: reset margin/padding và font mặc định */
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        /* Khung bản đồ phủ toàn màn hình */
        #map {
            width: 100%;
            height: 100vh;
        }

        /* Nhóm các nút điều khiển */
        .controls-container {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 250px;
        }

        /* Nút thao tác (định vị + chia sẻ) */
        .locate-button,
        .share-button {
            background: white;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
            font-weight: bold;
            border: none;
            width: 100%;
        }

        .share-button {
            background: #4CAF50;
            color: white;
        }

        /* Tiêu đề popup cho vùng */
        .info-popup h3 {
            color: #0026FF;
            font-size: 14px;
            border-bottom: 4px solid #f84803;
            text-align: center;
        }

        /* QUAN TRỌNG: Thu nhỏ khoảng trắng của bong bóng Leaflet */
        .leaflet-popup-content {
            margin: 2px 2px !important;
            width: auto !important;
            white-space: nowrap;
        }

        /* Cột nhãn các xã */
        .info-popup td:first-child {
            font-weight: bold;
            color: #ff0202;
        }

        /* Tùy biến nút layer của Leaflet */
        .leaflet-control-layers-toggle:after {
            content: "Chọn loại bản đồ";
            color: #333;
            font-weight: bold;
            font-size: 14px;
            padding-left: 30px;
            line-height: 36px;
            white-space: nowrap;
        }

        /* Popup nằm giữa - mũi tên hướng LÊN */
        .popup-below .leaflet-popup-tip-container {
            top: -15px;
            transform: rotate(180deg);
            justify-content: center;
        }

        /* Popup nằm TRÊN - mũi tên hướng XUỐNG (mặc định) */
        .popup-above .leaflet-popup-content-wrapper {
            margin-bottom: 8px;
        }

        .popup-above .leaflet-popup-tip {
            background: white;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid white;
            width: 0;
            height: 0;
        }

        .popup-below .leaflet-popup-content-wrapper {
            margin-top: 8px;
        }

        .popup-below .leaflet-popup-tip {
            background: white;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 8px solid white;
            width: 0;
            height: 0;
        }

        /* Popup wrapper scaling: scale the entire popup box including border and arrow */
        .leaflet-popup-content-wrapper.congtrinh-popup-wrapper {
            transition: transform 0.12s ease;
            transform-origin: center top;
            --popup-scale: 1;
            transform: scale(var(--popup-scale));
        }

        /* Popup scaling: adjust both transform AND content sizes so text/images scale */
        .congtrinh-popup {
            transition: font-size 0.12s ease;
            font-size: 1rem;
        }
        /* Base image rules to override inline sizes */
        .congtrinh-popup img,
        .congtrinh-popup-img {
            max-width: 160px;
            max-height: 120px;
            width: auto;
            height: auto;
        }
        .congtrinh-popup table { font-size: inherit; }
        .congtrinh-popup p { font-size: 0.8em; }

        /* Extra Small: zoom <= 10 */
        .congtrinh-popup.extra-small {
            font-size: 0.5rem;
        }
        .leaflet-popup-content-wrapper.congtrinh-popup-wrapper.extra-small {
            --popup-scale: 0.5;
        }
        .congtrinh-popup.extra-small .congtrinh-popup-img {
            max-width: calc(160px * 0.5);
            max-height: calc(120px * 0.5);
        }

        /* Small: zoom 10-12 */
        .congtrinh-popup.small {
            font-size: 0.75rem;
        }
        .leaflet-popup-content-wrapper.congtrinh-popup-wrapper.small {
            --popup-scale: 0.75;
        }
        .congtrinh-popup.small .congtrinh-popup-img {
            max-width: calc(160px * 0.75);
            max-height: calc(120px * 0.75);
        }

        /* Medium: zoom 12-14 */
        .congtrinh-popup.medium {
            font-size: 1rem;
        }
        .leaflet-popup-content-wrapper.congtrinh-popup-wrapper.medium {
            --popup-scale: 1.0;
        }
        .congtrinh-popup.medium .congtrinh-popup-img {
            max-width: 160px;
            max-height: 120px;
        }

        /* Large: zoom 14-16 */
        .congtrinh-popup.large {
            font-size: 1.25rem;
        }
        .leaflet-popup-content-wrapper.congtrinh-popup-wrapper.large {
            --popup-scale: 1.25;
        }
        .congtrinh-popup.large .congtrinh-popup-img {
            max-width: calc(160px * 1.25);
            max-height: calc(120px * 1.25);
        }

        /* Extra Large: zoom >= 16 */
        .congtrinh-popup.extra-large {
            font-size: 1.5rem;
        }
        .leaflet-popup-content-wrapper.congtrinh-popup-wrapper.extra-large {
            --popup-scale: 1.5;
        }
        .congtrinh-popup.extra-large .congtrinh-popup-img {
            max-width: calc(160px * 1.5);
            max-height: calc(120px * 1.5);
        }
    </style>
</head>

<body>
    <!-- Cụm điều khiển nằm góc phải dưới -->
    <div class="controls-container">
        <button class="locate-button" onclick="findMyState()">📍 Vị trí của tôi</button>
        <button class="share-button" onclick="shareLocation()">🔗 Chia sẻ vị trí của tôi</button>
    </div>

    <!-- Modal phóng to ảnh với nút điều hướng -->
    <div id="image-modal"
        style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:10000;justify-content:center;align-items:center;">
        <div style="position:relative;display:flex;flex-direction:column;align-items:center;">
            <img id="modal-img" style="max-width:80vw;max-height:80vh;border:2px solid white;">
            <!-- Hiển thị chỉ số ảnh hiện tại -->
            <div id="image-counter" style="color:white;margin-top:10px;font-size:14px;">Ảnh 1/1</div>
            <!-- Nút điều hướng -->
            <div style="margin-top:10px;display:flex;gap:10px;">
                <button onclick="prevImage()"
                    style="background:#4CAF50;color:white;border:none;padding:8px 15px;cursor:pointer;border-radius:5px;font-weight:bold;">←
                    Trước</button>
                <button onclick="nextImage()"
                    style="background:#4CAF50;color:white;border:none;padding:8px 15px;cursor:pointer;border-radius:5px;font-weight:bold;">Tiếp
                    →</button>
            </div>
            <!-- Nút đóng -->
            <button onclick="closeImageModal()"
                style="position:absolute;top:10px;right:10px;background:red;color:white;border:none;padding:5px 10px;cursor:pointer;border-radius:3px;">Đóng</button>
        </div>
    </div>

    <!-- Bản đồ Leaflet -->
    <div id="map"></div>

    <script>
        // Biến quản lý modal hình ảnh
        var currentImageIndex = 0;
        var imageList = [];

        // Khởi tạo bản đồ
        var map = L.map('map', { center: [16.0544, 108.2022], zoom: 11 });
        // Vị trí hiện tại của người dùng
        var currentUserPos = null;
        // Lớp đường đang được tô nổi bật
        var lastHighlightedLayer = null;
        // Marker vị trí người dùng
        var currentUserMarker = null;
        // Bộ định thời cập nhật vị trí
        var locationIntervalId = null;

        // Các lớp nền Google
        var googleHybrid = L.tileLayer('http://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], attribution: 'Google Hybrid'
        }).addTo(map);

        var googleRoadmap = L.tileLayer('http://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], attribution: 'Google Roadmap'
        });

        var googleTerrain = L.tileLayer('http://{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
            maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], attribution: 'Google Terrain'
        });

        // Bộ chuyển lớp nền
        var baseMaps = { "Vệ tinh": googleHybrid, "Giao thông": googleRoadmap, "Địa hình": googleTerrain };
        L.control.layers(baseMaps).addTo(map);

        // Lớp dữ liệu GeoJSON
        let geoJsonLayer;
        let ql14dLayer;
        let congTrinhLayer;
        let hasZoomedToQL14D = false;

        // Tạo pane cho marker CongTrinh để ở trên các lớp khác
        map.createPane('congTrinhPane');
        map.getPane('congTrinhPane').style.zIndex = 650;

        function isCongTrinhFeature(feature) {
            return feature && feature.geometry && feature.geometry.type === 'Point'
                && feature.properties && feature.properties.timestamp && feature.properties.visited;
        }

        // Tạo HTML popup cho các điểm CongTrinh14D (hiển thị thông tin & hình ảnh)
        function createCongTrinhPopup(feature) {
            const p = feature.properties || {};
            const rows = [];
            const keysToHide = ['__congTrinhId', '__idx', 'description', 'visible', 'name', 'visited', 'timestamp', '__totalFeatures', 'image'];
            for (const key in p) {
                if (!Object.prototype.hasOwnProperty.call(p, key)) continue;
                if (keysToHide.includes(key)) continue; // Skip unwanted fields
                const label = key;
                let value = String(p[key]).replace(/\n/g, '<br>');
                rows.push(`<tr><td>${label}</td><td style="text-align:right">${value}</td></tr>`);
            }

            // Thêm trường description nếu có
            let descriptionHtml = '';
            if (p.description) {
                descriptionHtml = `<p style="margin:0 0 8px;white-space:pre-line;">${String(p.description).replace(/\n/g, '<br>')}</p>`;
            }

            // Xử lý trường image: nếu có nhiều ảnh cách nhau bằng dấu phẩy, chỉ hiển thị ảnh đầu tiên
            let singleImageHtml = '';
            if (p.image && p.image.trim().length > 0) {
                const images = p.image.split(',').map(img => img.trim()).filter(img => img.length > 0);
                if (images.length > 0) {
                    singleImageHtml = `<img src="${images[0]}" alt="Hình ảnh" class="congtrinh-popup-img" style="border:1px solid #ccc;cursor:pointer;margin-top:8px;" onclick="enlargeImage('${p.image}')">`;
                }
            }

            return `<div class="info-popup congtrinh-popup"><h3>${p.name || 'Thông tin điểm'}</h3>${descriptionHtml}<table>${rows.join('')}</table>${singleImageHtml}</div>`;
        }

        // Cập nhật kích thước popup dựa trên mức zoom của bản đồ
        function updateCongTrinhPopupSizes() {
            try {
                const z = map.getZoom();
                // Xác định class dựa trên zoom level: extra-small, small, medium, large, extra-large
                let cls = 'medium'; // mặc định
                if (z <= 10) cls = 'extra-small';
                else if (z <= 12) cls = 'small';
                else if (z <= 14) cls = 'medium';
                else if (z <= 16) cls = 'large';
                else cls = 'extra-large';
                
                // Áp dụng class cho tất cả popup congtrinh và wrapper của chúng
                document.querySelectorAll('.congtrinh-popup').forEach(el => {
                    el.classList.remove('extra-small', 'small', 'medium', 'large', 'extra-large');
                    el.classList.add(cls);
                    // Cập nhật class cho wrapper cũng
                    const wrapper = el.closest('.leaflet-popup-content-wrapper');
                    if (wrapper) {
                        wrapper.classList.remove('extra-small', 'small', 'medium', 'large', 'extra-large');
                        wrapper.classList.add(cls);
                    }
                });
            } catch (e) {
                // map chưa khởi tạo hoặc không có popup trên DOM
            }
        }

        // Khi popup được mở, cập nhật kích thước ngay lập tức theo zoom hiện tại
        map.on && map.on('popupopen', function (e) {
            // Delay ngắn để nội dung popup đã được mount vào DOM
            setTimeout(updateCongTrinhPopupSizes, 10);
        });

        // Khi thay đổi zoom, cập nhật các popup đang mở
        map.on && map.on('zoomend', function () {
            updateCongTrinhPopupSizes();
        });

        // HÀM XỬ LÝ SỰ KIỆN CHO MỖI ĐỐI TƯỢNG
        function onEachFeatureHandler(feature, layer) {
            if (feature.properties) {
                const p = feature.properties;
                const labels = { "dan_so": "Dân số", "dtich_km2": "Diện tích (km²)", "matdo_km2": "Mật độ" };
                const keysToHide = ['name', 'styleUrl', 'styleHash', 'description', 'stroke', 'fill', 'fill-opacity', 'stroke-opacity', 'stroke-width', 'Tên phường/xã', 'ten_xa', 'loai'];

                let fullTitle = (p.loai ? p.loai + " " : "") + (p.ten_xa || p.name || "Thông tin");

                // 1. XỬ LÝ CHO ĐIỂM CONGTRINH14D (Xen kẽ trên/dưới)
                if (isCongTrinhFeature(feature)) {
                    const idx = p.__idx || 0;
                    const isAbove = idx % 2 === 0; // Chỉ số chẵn hiện phía trên, lẻ hiện phía dưới

                    // Tính toán offset: 
                    // Nếu trên: Offset Y âm (-25) để đẩy popup lên trên marker cách xa.
                    // Nếu dưới: Offset Y dương (+200) để đẩy toàn bộ popup xuống dưới marker cách xa.
                    const popupOffset = isAbove ? L.point(0, -55) : L.point(0, 300);

                    layer.bindPopup(createCongTrinhPopup(feature), {
                        autoClose: false,
                        closeOnClick: true,
                        offset: popupOffset,
                        className: (isAbove ? 'popup-above' : 'popup-below') + ' congtrinh-popup-wrapper' // Thêm class để xử lý CSS mũi tên và scaling
                    });
                }

                // 3. XỬ LÝ CHO VÙNG (map.geojson)
                else {
                    let rows = "";
                    for (let key in p) {
                        if (!keysToHide.includes(key)) {
                            let displayLabel = labels[key] || key;
                            rows += `<tr><td>${displayLabel}</td><td style="text-align:right">${p[key]}</td></tr>`;
                        }
                    }
                    layer.bindPopup(`<div class="info-popup"><h3>${fullTitle}</h3><table>${rows}</table></div>`);
                }
            }

            // Hiệu ứng hover
            layer.on({
                mouseover: function (e) {
                    if (e.target !== lastHighlightedLayer) {
                        e.target.setStyle({ weight: 7, color: '#FF0000' });
                        if (e.target.bringToFront) e.target.bringToFront();
                    }
                },
                mouseout: function (e) {
                    if (e.target !== lastHighlightedLayer) {
                        if (ql14dLayer && ql14dLayer.hasLayer(e.target)) {
                            ql14dLayer.resetStyle(e.target);
                        } else if (congTrinhLayer && congTrinhLayer.hasLayer(e.target)) {
                            congTrinhLayer.resetStyle(e.target);
                        } else {
                            geoJsonLayer.resetStyle(e.target);
                        }
                    }
                }
            });
        }

        // ===== TẢI DỮ LIỆU GEOJSON =====
        // Tải dữ liệu ranh giới vùng
        fetch('map.geojson')
            .then(res => res.json())
            .then(data => {
                // Tạo lớp GeoJSON cho các vùng hành chính
                geoJsonLayer = L.geoJSON(data, {
                    style: function () { return { fillOpacity: 0.1, color: getRandomColor(), weight: 1 }; },
                    onEachFeature: onEachFeatureHandler
                }).addTo(map);
            })
            .then(() => {
                return fetch('QL14D.geojson');
            })
            .then(res => res.json())
            .then(data => {

                // Tạo lớp GeoJSON cho đường QL14D (vàng cam)
                ql14dLayer = L.geoJSON(data, {
                    style: function () { return { color: '#FFD800', weight: 8, opacity: 1 }; },
                    onEachFeature: onEachFeatureHandler
                }).addTo(map);

                // Zoom vào đường QL14D và mở popup lần đầu
                ql14dLayer.eachLayer(function (layer) {
                    if (!hasZoomedToQL14D && layer.getBounds) {
                        map.fitBounds(layer.getBounds(), { padding: [50, 50] });
                        if (layer.getPopup) {
                            layer.openPopup();
                        }
                        hasZoomedToQL14D = true;
                    }
                });
            })
            .then(() => fetch('CongTrinh14D.geojson'))
            .then(res => res.json())
            .then(data => {
                // Lọc các điểm hiển thị (visible=true) và thêm index cho từng điểm
                if (data.features && Array.isArray(data.features)) {
                    data.features = data.features.filter(f => f.properties && f.properties.visible !== false);
                    const totalFeatures = data.features.length;
                    data.features.forEach((feature, idx) => {
                        if (feature.properties) {
                            feature.properties.__congTrinhId = 'ct-' + idx;
                            feature.properties.__idx = idx;
                            feature.properties.__totalFeatures = totalFeatures;
                        }
                    });
                }
                // Tạo lớp GeoJSON cho các điểm CongTrinh14D (marker cam)
                congTrinhLayer = L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 8,
                            color: '#FF5722',
                            fillColor: '#FF8A50',
                            fillOpacity: 0.9,
                            weight: 3,
                            interactive: true,
                            pane: 'congTrinhPane'
                        });
                    },
                    onEachFeature: onEachFeatureHandler
                }).addTo(map);

                // Mở tất cả popup CongTrinh lần đầu
                congTrinhLayer.eachLayer(function (layer) {
                    if (layer.getPopup) {
                        layer.openPopup();
                        layer.getPopup().update();
                    }
                });
            });

        // ===== VỊ TRÍ NGƯỜI DÙNG =====
        // Lấy vị trí hiện tại và cập nhật mỗi 5 giây
        function findMyState() {
            navigator.geolocation.getCurrentPosition(function (p) {
                const lat = p.coords.latitude, lng = p.coords.longitude;
                currentUserPos = [lat, lng];

                // Xóa marker cũ nếu tồn tại
                if (currentUserMarker) {
                    map.removeLayer(currentUserMarker);
                }

                // Tạo marker vị trí mới, zoom vào lần đầu tiên
                currentUserMarker = L.marker(currentUserPos).addTo(map).bindPopup("<b>Bạn đang ở đây!</b>").openPopup();
                map.setView(currentUserPos, 15);

                // Khởi động cập nhật vị trí định kỳ (mỗi 5 giây)
                if (!locationIntervalId) {
                    locationIntervalId = setInterval(function () {
                        navigator.geolocation.getCurrentPosition(function (p) {
                            const lat = p.coords.latitude, lng = p.coords.longitude;
                            currentUserPos = [lat, lng];

                            // Loại bỏ marker cũ
                            if (currentUserMarker) {
                                map.removeLayer(currentUserMarker);
                            }

                            // Tạo marker mới tại vị trí cập nhật
                            currentUserMarker = L.marker(currentUserPos).addTo(map).bindPopup("<b>Bạn đang ở đây!</b>");
                        });
                    }, 5000);
                }
            });
        }

        // Chia sẻ vị trí người dùng qua link Google Maps
        function shareLocation() {
            if (!currentUserPos) {
                alert("Vui lòng nhấn 'Vị trí của tôi' trước khi chia sẻ!");
                return;
            }
            const url = `https://www.google.com/maps?q=${currentUserPos[0]},${currentUserPos[1]}`;
            // Chia sẻ bằng Share API hoặc copy link
            if (navigator.share) {
                navigator.share({ title: 'Vị trí của tôi', text: 'Vị trí của tôi', url: url });
            } else {
                navigator.clipboard.writeText(url);
                alert("Link vị trí đã được copy vào bộ nhớ tạm!");
            }
        }

        // ===== QUẢN LÝ MODAL HÌNH ẢNH =====
        // Phóng to hình ảnh trong modal overlay
        // Input: src có thể là một đường dẫn hoặc chuỗi nhiều đường dẫn cách nhau bằng dấu phẩy
        function enlargeImage(src) {
            // Nếu src chứa dấu phẩy, tách thành mảng
            if (src.includes(',')) {
                imageList = src.split(',').map(img => img.trim()).filter(img => img.length > 0);
            } else {
                imageList = [src.trim()];
            }

            // Bắt đầu từ ảnh đầu tiên
            currentImageIndex = 0;
            updateModalImage();
            document.getElementById('image-modal').style.display = 'flex';
        }

        // Cập nhật ảnh hiển thị trong modal
        function updateModalImage() {
            if (imageList.length === 0) return;

            document.getElementById('modal-img').src = imageList[currentImageIndex];
            document.getElementById('image-counter').innerText = `Ảnh ${currentImageIndex + 1}/${imageList.length}`;
        }

        // Chuyển đến ảnh tiếp theo
        function nextImage() {
            if (imageList.length === 0) return;
            currentImageIndex = (currentImageIndex + 1) % imageList.length;
            updateModalImage();
        }

        // Chuyển đến ảnh trước đó
        function prevImage() {
            if (imageList.length === 0) return;
            currentImageIndex = (currentImageIndex - 1 + imageList.length) % imageList.length;
            updateModalImage();
        }

        // Đóng modal hình ảnh
        function closeImageModal() {
            document.getElementById('image-modal').style.display = 'none';
            imageList = [];
            currentImageIndex = 0;
        }

        // Tạo màu ngẫu nhiên cho các vùng hành chính
        function getRandomColor() {
            var letters = '0123456789ABCDEF';
            var color = '#';
            for (var i = 0; i < 6; i++) { color += letters[Math.floor(Math.random() * 16)]; }
            return color;
        }
    </script>
</body>

</html>
